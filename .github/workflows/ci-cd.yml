name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Ansible
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install Ansible
      run: |
        pip install ansible ansible-lint
    
    - name: Install Ansible collections
      run: |
        ansible-galaxy collection install -r requirements.yml
    
    - name: Syntax check
      run: |
        ansible-playbook --syntax-check playbooks/deploy.yml
        ansible-playbook --syntax-check playbooks/setup.yml
        ansible-playbook --syntax-check playbooks/test.yml
        ansible-playbook --syntax-check playbooks/demo.yml
    
    - name: Ansible Lint
      run: |
        ansible-lint playbooks/*.yml || true
    
    - name: Test local connectivity
      run: |
        ansible all -i inventory/local/hosts -m ping
  
  test-demo:
    name: Test Demo Deployment
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install Ansible
      run: |
        pip install ansible
    
    - name: Install collections
      run: |
        ansible-galaxy collection install -r requirements.yml
    
    - name: Run demo deployment
      run: |
        ansible-playbook playbooks/demo.yml
    
    - name: Verify deployment
      run: |
        test -f ~/jenkins-ansible-demo/app.py
        test -f ~/jenkins-ansible-demo/requirements.txt
        test -f ~/jenkins-ansible-demo/config/app.conf
        echo "✅ All files deployed successfully"
    
    - name: Test application
      run: |
        cd ~/jenkins-ansible-demo
        python3 app.py &
        APP_PID=$!
        sleep 3
        curl -f http://localhost:8080/ || exit 1
        curl -f http://localhost:8080/health || exit 1
        kill $APP_PID
        echo "✅ Application tested successfully"
  
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Ansible image
      run: |
        docker build -f Dockerfile.ansible -t ansible-control:latest .
    
    - name: Test Docker Compose
      run: |
        docker-compose config
