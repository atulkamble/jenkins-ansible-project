---
- name: Deploy Application
  hosts: all
  become: yes
  vars:
    app_name: "myapp"
    app_version: "1.0.0"
    app_user: "appuser"
    app_directory: "/opt/{{ app_name }}"
  
  tasks:
    - name: Update system packages
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"
    
    - name: Install required packages
      package:
        name:
          - git
          - curl
          - wget
          - unzip
        state: present
    
    - name: Create application user
      user:
        name: "{{ app_user }}"
        shell: /bin/bash
        create_home: yes
        state: present
    
    - name: Create application directory
      file:
        path: "{{ app_directory }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'
    
    - name: Deploy application files
      copy:
        src: ../app/
        dest: "{{ app_directory }}/"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0644'
      notify: Restart application
    
    - name: Create application configuration
      template:
        src: ../templates/app.conf.j2
        dest: "{{ app_directory }}/config/app.conf"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0644'
      notify: Restart application
    
    - name: Display deployment info
      debug:
        msg: "Application {{ app_name }} v{{ app_version }} deployed to {{ env }} environment"
  
  handlers:
    - name: Restart application
      service:
        name: "{{ app_name }}"
        state: restarted
      when: ansible_service_mgr == "systemd"
