---
- name: Install HAProxy
  package:
    name: haproxy
    state: present

- name: Configure HAProxy
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: '0644'
  notify: Restart HAProxy

- name: Enable HAProxy
  lineinfile:
    path: /etc/default/haproxy
    regexp: '^ENABLED='
    line: 'ENABLED=1'
  when: ansible_os_family == "Debian"

- name: Start and enable HAProxy
  service:
    name: haproxy
    state: started
    enabled: yes
